    <script>
      // Safeguard for iframe / sandboxed environments where Window.prototype.fetch has only a getter
      (function() {
        try {
          var targetObj = typeof window !== 'undefined' ? window : (typeof globalThis !== 'undefined' ? globalThis : null);
          if (!targetObj) return;

          var currentFetch = targetObj.fetch;

          // 1. Ensure Window.prototype has a setter if fetch descriptor exists on prototype
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              var protoDesc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
              if (protoDesc && (!protoDesc.set || !protoDesc.writable)) {
                var protoGetter = protoDesc.get;
                var storedFetch = currentFetch;
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function() {
                    return storedFetch || (protoGetter ? protoGetter.call(this) : currentFetch);
                  },
                  set: function(newVal) {
                    storedFetch = newVal;
                  },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (eProto) {}
          }

          // 2. Ensure window instance has a writable / set-enabled fetch
          try {
            var winDesc = Object.getOwnPropertyDescriptor(targetObj, 'fetch');
            if (!winDesc || !winDesc.set || !winDesc.writable) {
              var localFetch = currentFetch;
              Object.defineProperty(targetObj, 'fetch', {
                get: function() {
                  return localFetch;
                },
                set: function(newVal) {
                  localFetch = newVal;
                },
                configurable: true,
                enumerable: true
              });
            }
          } catch (eWin) {}
        } catch (e) {}
      })();
    </script>
